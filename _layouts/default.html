<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="container">
    
    {% if page.url != "/" and page.url != "/index.html" %}
      <nav style="margin-bottom: 30px;">
        <a href="/" style="text-decoration: none; color: #0366d6; font-weight: bold;">
          ← 返回首页目录
        </a>
        <hr style="border: 0; border-top: 1px solid #eee; margin-top: 15px;">
      </nav>
    {% endif %}

    <article>
      {% if page.date %}
        <h1 style="margin-bottom: 10px;">{{ page.title }}</h1>
        <p style="color: #999; font-size: 0.9em;">发布日期：{{ page.date | date: "%Y-%m-%d" }}</p>
      {% endif %}

      {{ content }}
    </article>

    {% if page.url != "/" and page.url != "/index.html" %}
      <footer style="margin-top: 50px; padding-top: 20px; border-top: 1px dashed #eee; text-align: center;">
        <a href="/" style="text-decoration: none; color: #0366d6;">回到首页</a>
      </footer>
    {% endif %}

  </div>
</body>
</html>
